<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Εξουσιοδοτημένη Είσοδος</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0ea5e9;
            --primary-hover: #0284c7;
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --error: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 50% 20%, #1e293b 0%, #0f172a 75%, #020617 100%);
            color: var(--text-main);
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 40px 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), 0 0 40px rgba(14, 165, 233, 0.15);
            backdrop-filter: blur(16px);
            text-align: center;
            animation: cardAppear 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes cardAppear {
            from { opacity: 0; transform: translateY(20px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .avatar-wrapper {
            width: 110px;
            height: 110px;
            margin: 0 auto 20px auto;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .avatar-glow {
            position: absolute;
            inset: -8px;
            background: radial-gradient(circle, rgba(14, 165, 233, 0.4) 0%, transparent 70%);
            border-radius: 50%;
            animation: pulseGlow 3s infinite alternate;
        }

        @keyframes pulseGlow {
            from { transform: scale(0.9); opacity: 0.6; }
            to { transform: scale(1.15); opacity: 1; }
        }

        .avatar-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(14, 165, 233, 0.5);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            position: relative;
            z-index: 2;
            background: #1e293b;
        }

        .happy-svg {
            width: 100px;
            height: 100px;
            position: relative;
            z-index: 2;
            filter: drop-shadow(0 6px 16px rgba(14, 165, 233, 0.3));
        }

        h1 {
            font-size: 1.45rem;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 8px;
            letter-spacing: -0.3px;
        }

        p.subtitle {
            font-size: 0.92rem;
            color: var(--text-muted);
            margin-bottom: 28px;
            line-height: 1.5;
        }

        /* 6 PIN Input Boxes */
        .pin-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 24px;
        }

        .pin-digit {
            width: 50px;
            height: 60px;
            background: rgba(15, 23, 42, 0.8);
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            font-size: 1.7rem;
            font-weight: 800;
            color: #38bdf8;
            text-align: center;
            outline: none;
            transition: all 0.2s ease;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.4);
        }

        .pin-digit:focus {
            border-color: #38bdf8;
            background: rgba(14, 165, 233, 0.1);
            box-shadow: 0 0 16px rgba(56, 189, 248, 0.35);
            transform: translateY(-2px);
        }

        .error-message {
            color: #f87171;
            font-size: 0.88rem;
            font-weight: 600;
            min-height: 24px;
            margin-bottom: 16px;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .error-message.visible {
            opacity: 1;
        }

        .btn-unlock {
            width: 100%;
            padding: 14px 20px;
            background: linear-gradient(135deg, #0ea5e9, #0284c7);
            color: #ffffff;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 16px rgba(14, 165, 233, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-unlock:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(14, 165, 233, 0.5);
            background: linear-gradient(135deg, #38bdf8, #0ea5e9);
        }

        .btn-unlock:active {
            transform: translateY(0);
        }

        .back-link {
            display: inline-block;
            margin-top: 22px;
            color: var(--text-muted);
            font-size: 0.85rem;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .back-link:hover {
            color: #ffffff;
        }

        /* Shake animation for incorrect password */
        .shake {
            animation: shake 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }

        /* Success Green Pulse */
        .success-mode .pin-digit {
            border-color: var(--success) !important;
            color: var(--success) !important;
            background: rgba(16, 185, 129, 0.15) !important;
        }
    </style>
</head>
<body>

    <div class="login-card" id="login-card">
        <!-- Avatar: Cheerful / Happy Smiling Mascot -->
        <div class="avatar-wrapper">
            <div class="avatar-glow"></div>
            <img src="assets/images/mascot_success.jpg" alt="Επιτυχία" class="avatar-img" onerror="this.style.display='none'; document.getElementById('avatar-svg').style.display='block';">
            <!-- SVG Fallback -->
            <svg class="happy-svg" id="avatar-svg" style="display:none;" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="50" r="46" fill="#FBBF24"/>
                <circle cx="50" cy="50" r="46" stroke="#F59E0B" stroke-width="4"/>
                <path d="M28 38C28 38 34 31 40 38" stroke="#78350F" stroke-width="5" stroke-linecap="round"/>
                <path d="M60 38C60 38 66 31 72 38" stroke="#78350F" stroke-width="5" stroke-linecap="round"/>
                <ellipse cx="26" cy="52" rx="7" ry="4" fill="#F87171" opacity="0.6"/>
                <ellipse cx="74" cy="52" rx="7" ry="4" fill="#F87171" opacity="0.6"/>
                <path d="M30 52C30 68 70 68 70 52" stroke="#78350F" stroke-width="5" stroke-linecap="round"/>
                <path d="M33 55C37 66 63 66 67 55" fill="#EF4444"/>
            </svg>
        </div>

        <h1>Καλωσήρθατε</h1>
        <p class="subtitle">Εξουσιοδοτημένη πρόσβαση διαχειριστή.<br>Πληκτρολογήστε τον 6-ψήφιο κωδικό εισόδου:</p>

        <!-- 6 PIN Input Boxes -->
        <div class="pin-container" id="pin-container">
            <input type="password" maxlength="1" inputmode="numeric" class="pin-digit" id="p1" autofocus>
            <input type="password" maxlength="1" inputmode="numeric" class="pin-digit" id="p2">
            <input type="password" maxlength="1" inputmode="numeric" class="pin-digit" id="p3">
            <input type="password" maxlength="1" inputmode="numeric" class="pin-digit" id="p4">
            <input type="password" maxlength="1" inputmode="numeric" class="pin-digit" id="p5">
            <input type="password" maxlength="1" inputmode="numeric" class="pin-digit" id="p6">
        </div>

        <div class="error-message" id="error-msg">Λανθασμένος κωδικός πρόσβασης!</div>

        <button class="btn-unlock" id="btn-submit" type="button" onclick="validateCode()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <span>Είσοδος στην Πλατφόρμα</span>
        </button>

        <div>
            <a href="crash.html" class="back-link">← Επιστροφή στην αρχική σελίδα</a>
        </div>
    </div>

    <script>
        const MASTER_CODE = "888888";
        const pinInputs = [
            document.getElementById('p1'),
            document.getElementById('p2'),
            document.getElementById('p3'),
            document.getElementById('p4'),
            document.getElementById('p5'),
            document.getElementById('p6')
        ];
        const errorMsg = document.getElementById('error-msg');
        const loginCard = document.getElementById('login-card');

        // Check if already authenticated
        if (localStorage.getItem('pathologia_access_granted') === MASTER_CODE) {
            window.location.replace('index.html');
        }

        // Auto-advance and backspace handlers for 6 PIN boxes
        pinInputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                const val = e.target.value.replace(/[^0-9]/g, '');
                e.target.value = val ? val[0] : '';
                errorMsg.classList.remove('visible');

                if (val && index < 5) {
                    pinInputs[index + 1].focus();
                }

                // If all 6 digits entered, auto-validate!
                const currentCode = pinInputs.map(p => p.value).join('');
                if (currentCode.length === 6) {
                    validateCode();
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !input.value && index > 0) {
                    pinInputs[index - 1].focus();
                } else if (e.key === 'Enter') {
                    validateCode();
                }
            });

            // Support pasting 6 digits
            input.addEventListener('paste', (e) => {
                e.preventDefault();
                const pasted = (e.clipboardData || window.clipboardData).getData('text').trim();
                const digits = pasted.replace(/[^0-9]/g, '').slice(0, 6);
                if (digits) {
                    digits.split('').forEach((d, i) => {
                        if (pinInputs[i]) pinInputs[i].value = d;
                    });
                    if (digits.length === 6) {
                        validateCode();
                    } else if (pinInputs[digits.length]) {
                        pinInputs[digits.length].focus();
                    }
                }
            });
        });

        function validateCode() {
            const entered = pinInputs.map(p => p.value).join('');
            if (entered === MASTER_CODE) {
                // Success!
                loginCard.classList.add('success-mode');
                errorMsg.style.color = '#10b981';
                errorMsg.textContent = '✓ Πρόσβαση εγκρίθηκε! Μετάβαση...';
                errorMsg.classList.add('visible');

                // Save permanently in localStorage
                localStorage.setItem('pathologia_access_granted', MASTER_CODE);

                setTimeout(() => {
                    window.location.replace('index.html');
                }, 400);
            } else {
                // Error!
                loginCard.classList.add('shake');
                errorMsg.style.color = '#f87171';
                errorMsg.textContent = 'Λανθασμένος κωδικός! Δοκιμάστε ξανά.';
                errorMsg.classList.add('visible');

                pinInputs.forEach(p => p.value = '');
                pinInputs[0].focus();

                setTimeout(() => {
                    loginCard.classList.remove('shake');
                }, 500);
            }
        }
    </script>
</body>
</html>
