<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Πρωτοβάθμια Φροντίδα Υγείας - Τράπεζα Θεμάτων (325 Θέματα) - By TseLkos</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Larnaka-style Pink-Purple-Blue Stylesheet -->
  <link rel="stylesheet" href="protovathmia_mcq.css?v=20261127.v3">
  <link rel="stylesheet" href="image_zoom_viewer.css">
</head>
<body>

  <div class="app-container">

    <!-- Header Section (Larnaka-style) -->
    <header class="app-header">
      <div class="header-main">
        <div class="app-logo">
          <div class="app-logo-icon">
            <i class="fa-solid fa-house-chimney-medical"></i>
          </div>
          <h1>
            Pathologia<span class="logo-highlight">Quiz</span>
            <span class="author-tag">🏛️ Πρωτοβάθμια Φροντίδα Υγείας (325 Θέματα)</span>
          </h1>
        </div>

        <div class="header-controls">
          <a href="../index.html" class="header-btn" title="Επιστροφή στην Κεντρική Πύλη">
            <i class="fa-solid fa-house"></i>
            <span>Αρχική</span>
          </a>

          <a href="../search.html" class="header-btn" title="Σύνθετη Αναζήτηση σε Όλα">
            <i class="fa-solid fa-magnifying-glass"></i>
            <span>Αναζήτηση</span>
          </a>

          <button type="button" class="header-btn" id="openResultsBtn" title="Προβολή Στατιστικών &amp; Σκορ">
            <i class="fa-solid fa-chart-pie" style="color: #9333ea;"></i>
            <span>Σκορ</span>
          </button>
        </div>
      </div>

      <!-- Progress Bar Tracker -->
      <div class="progress-container">
        <div class="progress-bar-wrapper">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="progress-stats">
          <span id="progressText">Ερώτηση 1 από 325</span>
          <span id="scoreText">Σκορ: 0 (0%)</span>
        </div>
      </div>
    </header>

    <!-- Main Quiz View Panel (Larnaka View Panel Architecture) -->
    <main class="view-panel" id="quiz-view">

      <!-- 1. Chapter / Clinical Scenario Large Dropdown Button & Overlay -->
      <div class="quick-dropdown-wrapper">
        <button type="button" class="large-dropdown-select-btn" id="quickChaptersBtn">
          <span class="dropdown-label">Κλινικό Σενάριο / Κεφάλαιο</span>
          <span class="dropdown-value" id="quickChaptersValue">Όλα</span>
          <svg class="dropdown-arrow" fill="none" height="20" width="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"></path>
          </svg>
        </button>
        <div class="chapters-vertical-list-overlay hidden" id="quickChaptersOverlay">
          <!-- Dynamic Chapters injected via JS -->
        </div>
      </div>

      <!-- 2. Question Large Dropdown Button & Overlay -->
      <div class="quick-dropdown-wrapper">
        <button type="button" class="large-dropdown-select-btn" id="quickQuestionsBtn">
          <span class="dropdown-label">Ερώτηση</span>
          <span class="dropdown-value" id="quickQuestionsValue">Φόρτωση ερώτησης...</span>
          <svg class="dropdown-arrow" fill="none" height="20" width="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"></path>
          </svg>
        </button>
        <div class="questions-vertical-list-overlay hidden" id="quickQuestionsOverlay">
          <!-- Dynamic Questions injected via JS -->
        </div>
      </div>

      <!-- Category & Code Badges -->
      <div class="category-tag-wrapper">
        <span class="badge" id="categoryBadge">1ο Κλινικό Σενάριο</span>
        <span class="badge badge-code" id="questionCodeBadge">PF_Q001</span>
        <span class="badge badge-type" id="questionTypeBadge">🎯 Πολλαπλής Επιλογής</span>
      </div>

      <!-- Synchronized Navigation Bar (TOP) -->
      <div class="quiz-navigation">
        <button type="button" class="btn-nav btn-nav-prev" id="prevBtnTop" disabled>
          <i class="fa-solid fa-arrow-left"></i>
          <span>Προηγούμενη</span>
        </button>

        <div class="jump-box">
          <span>Μετάβαση:</span>
          <input type="number" id="jumpInput" class="jump-input" min="1" value="1">
        </div>

        <button type="button" class="btn-nav btn-nav-next" id="nextBtnTop">
          <span>Επόμενη</span>
          <i class="fa-solid fa-arrow-right"></i>
        </button>
      </div>

      <!-- Question Text Box (Padded, Justified, 6px Left Border) -->
      <div class="question-container">
        <div id="questionText">Φόρτωση ερώτησης...</div>
      </div>

      <!-- Options List (Stacked Buttons with Instant High-Contrast Feedback) -->
      <div class="options-list" id="optionsList">
        <!-- Dynamic option buttons go here -->
      </div>

      <!-- Reveal Answer Button -->
      <div class="reveal-btn-container">
        <button type="button" class="reveal-answer-btn" id="revealAnswerBtn">
          <i class="fa-regular fa-lightbulb"></i>
          <span>Εμφάνιση Απάντησης &amp; Ανάλυσης</span>
        </button>
      </div>

      <!-- Explanation Panel (Larnaka-style spacious card, 3-tier system) -->
      <div class="explanation-panel collapsed" id="explanationPanel">
        <div class="explanation-panel-inner">
          <div class="explanation-content" id="explanationContent">
            <!-- Dynamic explanation text / tables injected here -->
          </div>
        </div>
      </div>

      <!-- Synchronized Navigation Bar (BOTTOM) -->
      <div class="quiz-navigation" style="margin-top: 16px;">
        <button type="button" class="btn-nav btn-nav-prev" id="prevBtnBottom" disabled>
          <i class="fa-solid fa-arrow-left"></i>
          <span>Προηγούμενη</span>
        </button>

        <button type="button" class="btn-nav btn-nav-next" id="nextBtnBottom">
          <span>Επόμενη</span>
          <i class="fa-solid fa-arrow-right"></i>
        </button>
      </div>

    </main>

  </div>

  <!-- Results Modal -->
  <div class="modal-overlay" id="resultsModal" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title">
          <i class="fa-solid fa-trophy"></i>
          <span>Στατιστικά Επίδοσης</span>
        </h3>
        <button type="button" class="modal-close-btn" id="closeResultsBtn">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-card-value" id="modalScoreVal">0%</div>
          <div class="stat-card-label">Επιτυχία (1η Προσπάθεια)</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-value" id="modalCorrectVal" style="color: #10b981;">0</div>
          <div class="stat-card-label">Σωστές Απαντήσεις</div>
        </div>
        <div class="stat-card" style="grid-column: span 2;">
          <div class="stat-card-value" id="modalAttemptsVal" style="color: #9333ea;">0</div>
          <div class="stat-card-label">Συνολικά Κλικ / Προσπάθειες</div>
        </div>
      </div>

      <div style="display: flex; justify-content: space-between; gap: 12px; margin-top: 8px;">
        <button type="button" class="btn-nav btn-nav-prev" id="resetScoreBtn" style="color: #ef4444; border-color: #fca5a5;">
          <i class="fa-solid fa-rotate-left"></i>
          <span>Μηδενισμός</span>
        </button>
        <button type="button" class="btn-nav btn-nav-next" onclick="document.getElementById('resultsModal').style.display='none'">
          <span>Συνέχεια</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Data Source Script -->
  <script src="themata_protovathmias.js?v=20261127.v90"></script>
  <!-- Image Zoom Viewer Script -->
  <script src="image_zoom_viewer.js"></script>
  <!-- Application Logic -->
  <script src="protovathmia_app.js?v=20261127.v8"></script>
</body>
</html>
