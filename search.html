<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <title>Σύνθετη Αναζήτηση</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
            margin: 0;
            padding: 20px;
        }
        h2 {
            color: #f97316;
            text-align: center;
            margin-bottom: 5px;
        }
        .search-container {
            max-width: 650px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
        }
        .search-fields {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .adv-search-input {
            width: 100%;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #cbd5e1;
            background: #f1f5f9;
            color: #1e293b;
            font-size: 1rem;
            box-sizing: border-box;
        }
        .adv-search-input:focus {
            outline: none;
            border-color: #f97316;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .adv-search-btn {
            background: #f97316;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 4px;
            font-size: 1.1rem;
            cursor: pointer;
            font-weight: bold;
            flex: 1;
            transition: background 0.2s;
        }
        .adv-search-btn:hover {
            background: #ea580c;
        }
        .clear-all-btn {
            background: #e2e8f0;
            color: #0f172a;
            border: none;
            padding: 12px;
            border-radius: 4px;
            font-size: 1.1rem;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            transition: background 0.2s;
        }
        .clear-all-btn:hover {
            background: #cbd5e1;
        }
        .options-bar {
            display: flex;
            justify-content: center;
            background: #f1f5f9;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 10px;
            border: 1px solid #cbd5e1;
        }
        .radio-label {
            margin: 0 15px;
            cursor: pointer;
            font-size: 0.95rem;
            color: #334155;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        #results {
            margin-top: 25px;
        }
        .result-item {
            background: #f1f5f9;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 15px;
            border-left: 4px solid #f97316;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .result-item:hover {
            transform: translateX(5px);
            background: #e2e8f0;
        }
        .result-title {
            font-weight: bold;
            color: #0f172a;
            margin-bottom: 5px;
        }
        .result-snippet {
            font-size: 0.9rem;
            color: #64748b;
            line-height: 1.5;
        }
        .hl-word {
            background: rgba(249, 115, 22, 0.3);
            color: #f97316;
            font-weight: bold;
            padding: 0 2px;
            border-radius: 2px;
        }
        .input-wrapper {
            position: relative;
            width: 100%;
        }
        .clear-btn {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #ef4444;
            font-weight: bold;
            font-size: 1.1rem;
            opacity: 0.7;
        }
        .clear-btn:hover {
            opacity: 1;
        }

        /* Custom Autocomplete Dropdown CSS */
        .custom-dropdown {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            z-index: 1000;
            height: 250px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            flex-direction: row;
        }
        .dropdown-sidebar {
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 5px 2px;
            background: #f1f5f9;
            border-right: 1px solid #cbd5e1;
            font-size: 0.75rem;
            align-items: center;
            min-width: 25px;
        }
        .dropdown-sidebar::-webkit-scrollbar { width: 4px; }
        .dropdown-sidebar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 2px; }
        .dropdown-sidebar span {
            cursor: pointer;
            color: #f97316;
            margin-bottom: 4px;
            font-weight: bold;
        }
        .dropdown-sidebar span:hover {
            color: #fff;
        }
        .dropdown-list {
            flex-grow: 1;
            overflow-y: auto;
            padding: 0;
            scroll-behavior: smooth;
        }
        .dropdown-list::-webkit-scrollbar { width: 8px; }
        .dropdown-list::-webkit-scrollbar-track { background: #ffffff; }
        .dropdown-list::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        
        .dropdown-header {
            font-weight: bold;
            color: #64748b;
            background: #f1f5f9;
            padding: 4px 8px;
            font-size: 0.8rem;
            position: sticky;
            top: 0;
            border-bottom: 1px solid #cbd5e1;
            z-index: 2;
        }
        .dropdown-item {
            padding: 8px 12px;
            cursor: pointer;
            color: #1e293b;
            font-size: 0.95rem;
            border-bottom: 1px solid #f1f5f9;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .dropdown-item:hover {
            background: #e2e8f0;
        }
        .item-actions {
            display: flex;
            gap: 10px;
        }
        .action-icon {
            font-size: 1rem;
            cursor: pointer;
            opacity: 0.6;
        }
        .action-icon:hover {
            opacity: 1;
        }
        .action-delete {
            color: #ef4444;
        }
        .action-pin {
            color: #eab308;
        }
        .pinned-active {
            opacity: 1 !important;
            color: #eab308 !important;
        }

    </style>
</head>
<body>

    <div class="search-container">
        <h2>Σύνθετη Αναζήτηση</h2>
        <div style="font-size: 0.85rem; color: #a1a1aa; margin-bottom: 15px; text-align: center;">
            Ψάχνει σε: Ερώτηση, Σύντομη Απάντηση, Κεφάλαιο, Υποκεφάλαιο.
        </div>
        
        <div class="search-fields">
            <form onsubmit="event.preventDefault(); doSearch();">
                
                <div class="options-bar">
                    <label class="radio-label">
                        <input type="radio" name="matchType" value="AND" checked>
                        Όλες οι λέξεις (ΚΑΙ)
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="matchType" value="OR">
                        Έστω μία (Ή)
                    </label>
                </div>

                <div class="input-wrapper" id="wrapper-1">
                    <input type="text" name="term1" class="adv-search-input" placeholder="Λέξη-κλειδί 1 (π.χ. πνευμονία)" autocomplete="off">
                    <span class="clear-btn" onclick="clearInput(this)" title="Καθαρισμός πεδίου">✕</span>
                </div>
                <div class="input-wrapper" id="wrapper-2">
                    <input type="text" name="term2" class="adv-search-input" placeholder="Λέξη-κλειδί 2 (π.χ. πυρετός)" autocomplete="off">
                    <span class="clear-btn" onclick="clearInput(this)" title="Καθαρισμός πεδίου">✕</span>
                </div>
                <div class="input-wrapper" id="wrapper-3">
                    <input type="text" name="term3" class="adv-search-input" placeholder="Λέξη-κλειδί 3" autocomplete="off">
                    <span class="clear-btn" onclick="clearInput(this)" title="Καθαρισμός πεδίου">✕</span>
                </div>
                <div class="input-wrapper" id="wrapper-4">
                    <input type="text" name="term4" class="adv-search-input" placeholder="Λέξη-κλειδί 4" autocomplete="off">
                    <span class="clear-btn" onclick="clearInput(this)" title="Καθαρισμός πεδίου">✕</span>
                </div>
                <div class="input-wrapper" id="wrapper-5">
                    <input type="text" name="term5" class="adv-search-input" placeholder="Λέξη-κλειδί 5" autocomplete="off">
                    <span class="clear-btn" onclick="clearInput(this)" title="Καθαρισμός πεδίου">✕</span>
                </div>
                
                <div class="btn-group">
                    <button type="submit" class="adv-search-btn">Αναζήτηση</button>
                    <button type="button" class="clear-all-btn" onclick="clearAllInputs()" title="Καθαρισμός όλων των πεδίων">🧹 Καθαρισμός</button>
                </div>
                
            </form>
        </div>

        <div id="results"></div>
    </div>

    <!-- Φορτώνουμε τα δεδομένα απ' ευθείας για ταχύτητα -->
    <script src="data/new_book_questions.js"></script>

    <script>
        const qData = (typeof newBookQuestionsData !== 'undefined') ? newBookQuestionsData : (typeof questions !== 'undefined' ? questions : []);
        let currentFocusInput = null;

        function removeAccents(str) {
            return str.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
        }

        // --- Persistence Logic ---
        function getHistory() {
            try {
                let saved = localStorage.getItem('search_history_all');
                if (saved) return JSON.parse(saved).filter(h => h && h.length >= 3);
            } catch(e) {}
            return [];
        }
        function getPinned() {
            try {
                let saved = localStorage.getItem('search_history_pinned');
                if (saved) return JSON.parse(saved);
            } catch(e) {}
            return [];
        }

        function saveHistoryTerm(term) {
            if (!term) return;
            term = term.trim();
            if (term.length < 3) return;
            
            let history = getHistory();
            history = history.filter(h => h !== term);
            history.push(term);
            localStorage.setItem('search_history_all', JSON.stringify(history));
        }

        function removeHistoryTerm(term, e) {
            if(e) { e.stopPropagation(); e.preventDefault(); }
            let history = getHistory();
            history = history.filter(h => h !== term);
            localStorage.setItem('search_history_all', JSON.stringify(history));
            
            // Also unpin if deleted
            let pinned = getPinned();
            if (pinned.includes(term)) togglePinTerm(term, e);
            else if (currentFocusInput) renderDropdownForInput(currentFocusInput);
        }

        function togglePinTerm(term, e) {
            if(e) { e.stopPropagation(); e.preventDefault(); }
            let pinned = getPinned();
            if (pinned.includes(term)) {
                pinned = pinned.filter(p => p !== term);
            } else {
                pinned.push(term);
            }
            localStorage.setItem('search_history_pinned', JSON.stringify(pinned));
            if (currentFocusInput) {
                renderDropdownForInput(currentFocusInput);
                currentFocusInput.focus();
            }
        }

        function clearInput(btn) {
            const wrapper = btn.parentElement;
            const input = wrapper.querySelector('input');
            if (input) {
                input.value = '';
                input.focus();
                renderDropdownForInput(input);
            }
        }

        function clearAllInputs() {
            document.querySelectorAll('.adv-search-input').forEach(i => i.value = '');
            closeAllDropdowns();
            document.querySelector('.adv-search-input').focus();
        }

        function closeAllDropdowns() {
            document.querySelectorAll('.custom-dropdown').forEach(d => d.remove());
        }

        function scrollToLetter(wrapperId, letter) {
            const list = document.querySelector(`#${wrapperId} .dropdown-list`);
            const header = document.querySelector(`#${wrapperId} #dd-letter-${letter}`);
            if (list && header) {
                list.scrollTop = header.offsetTop - list.offsetTop;
            }
        }

        function selectWord(inputName, word) {
            const input = document.querySelector(`input[name="${inputName}"]`);
            if (input) {
                input.value = word;
                closeAllDropdowns();
            }
        }

        function renderDropdownForInput(input) {
            closeAllDropdowns();
            
            const history = getHistory();
            const pinned = getPinned();
            
            if (history.length === 0 && pinned.length === 0) return;
            
            const filterText = removeAccents(input.value.trim());
            
            // Split into pinned, recent, and rest
            // A word shouldn't be in both 'recent' and 'pinned' visually to save space, but it's ok if it is in history
            let availableHistory = history.filter(h => !pinned.includes(h));
            
            let recent = availableHistory.slice(-5).reverse();
            let rest = availableHistory.slice(0, -5).sort((a, b) => a.localeCompare(b, 'el'));
            let activePinned = [...pinned].sort((a, b) => a.localeCompare(b, 'el'));
            
            if (filterText.length > 0) {
                recent = recent.filter(h => removeAccents(h).includes(filterText));
                rest = rest.filter(h => removeAccents(h).includes(filterText));
                activePinned = activePinned.filter(h => removeAccents(h).includes(filterText));
            }
            
            if (recent.length === 0 && rest.length === 0 && activePinned.length === 0) return;

            const wrapper = input.parentElement;
            const wrapperId = wrapper.id;
            const inputName = input.name;
            
            const dropdown = document.createElement('div');
            dropdown.className = 'custom-dropdown';
            dropdown.style.display = 'flex';
            
            let grouped = {};
            rest.forEach(h => {
                let firstChar = h.charAt(0).toUpperCase();
                firstChar = firstChar.normalize("NFD").replace(/[̀-ͯ]/g, "");
                if (!grouped[firstChar]) grouped[firstChar] = [];
                grouped[firstChar].push(h);
            });
            let letters = Object.keys(grouped).sort((a, b) => a.localeCompare(b, 'el'));
            
            let sidebarHtml = '<div class="dropdown-sidebar">';
            if (activePinned.length > 0) sidebarHtml += `<span onclick="scrollToLetter('${wrapperId}', 'Pin')">📌</span>`;
            if (recent.length > 0) sidebarHtml += `<span onclick="scrollToLetter('${wrapperId}', 'Recent')">⏱️</span>`;
            letters.forEach(l => {
                sidebarHtml += `<span onclick="scrollToLetter('${wrapperId}', '${l}')">${l}</span>`;
            });
            sidebarHtml += '</div>';
            
            let listHtml = '<div class="dropdown-list">';
            
            // Helper to render an item
            const renderItem = (h, isPinned) => {
                const pinClass = isPinned ? 'pinned-active' : '';
                return `<div class="dropdown-item" onclick="selectWord('${inputName}', '${h.replace(/'/g, "\\'")}')">
                            <span>${h}</span>
                            <div class="item-actions">
                                <span class="action-icon action-pin ${pinClass}" onclick="togglePinTerm('${h.replace(/'/g, "\\'")}', event)" title="Καρφίτσωμα">📌</span>
                                <span class="action-icon action-delete" onclick="removeHistoryTerm('${h.replace(/'/g, "\\'")}', event)" title="Διαγραφή">✕</span>
                            </div>
                        </div>`;
            };

            if (activePinned.length > 0) {
                listHtml += `<div class="dropdown-header" id="dd-letter-Pin">📌 Καρφιτσωμένα</div>`;
                activePinned.forEach(h => listHtml += renderItem(h, true));
            }

            if (recent.length > 0) {
                listHtml += `<div class="dropdown-header" id="dd-letter-Recent">⏱️ Πρόσφατα</div>`;
                recent.forEach(h => listHtml += renderItem(h, false));
            }
            
            letters.forEach(l => {
                listHtml += `<div class="dropdown-header" id="dd-letter-${l}">${l}</div>`;
                grouped[l].forEach(h => listHtml += renderItem(h, false));
            });
            
            listHtml += '</div>';
            
            dropdown.innerHTML = sidebarHtml + listHtml;
            
            dropdown.addEventListener('mousedown', (e) => { e.preventDefault(); });
            wrapper.appendChild(dropdown);
        }

        document.addEventListener('DOMContentLoaded', () => {
            const inputs = document.querySelectorAll('.adv-search-input');
            inputs.forEach(input => {
                input.addEventListener('focus', () => {
                    currentFocusInput = input;
                    renderDropdownForInput(input);
                });
                input.addEventListener('input', () => {
                    renderDropdownForInput(input);
                });
                input.addEventListener('blur', () => {
                    setTimeout(() => {
                        if (currentFocusInput === input) {
                            closeAllDropdowns();
                            currentFocusInput = null;
                        }
                    }, 200);
                });
            });
            
            document.addEventListener('click', (e) => {
                if (!e.target.closest('.input-wrapper')) {
                    closeAllDropdowns();
                }
            });
        });

        // --- Highlighting logic ---
        function highlightText(text, terms) {
            let highlighted = text;
            terms.forEach(t => {
                if (t.length < 2) return;
                // Create a regex to find the term ignoring accents/case, but keeping original text
                // Since JS regex doesn't natively support accent-insensitive matching without heavy lifting,
                // we'll do a simple workaround: we find positions using removed accents.
                
                // A reliable way in modern JS is iterating through the original string 
                // and checking substring matches.
            });
            return highlighted; // Wait, full accent-insensitive highlighting in plain JS is complex.
        }

        // A robust accent-insensitive highlighter
        function highlightMatch(sourceText, terms) {
            if (!sourceText) return "";
            
            let lowerNoAcc = removeAccents(sourceText);
            let chunks = [];
            let lastIdx = 0;
            
            // To prevent overlapping highlights, we find all matches and merge them
            let matches = [];
            terms.forEach(term => {
                let termNorm = removeAccents(term);
                if(termNorm.length < 2) return;
                
                let idx = lowerNoAcc.indexOf(termNorm);
                while (idx !== -1) {
                    matches.push({start: idx, end: idx + termNorm.length});
                    idx = lowerNoAcc.indexOf(termNorm, idx + 1);
                }
            });
            
            if (matches.length === 0) return sourceText.substring(0, 200) + "..."; // no match, just snippet
            
            // Sort matches
            matches.sort((a, b) => a.start - b.start);
            // Merge overlaps
            let merged = [];
            matches.forEach(m => {
                if (merged.length === 0) merged.push(m);
                else {
                    let prev = merged[merged.length - 1];
                    if (m.start <= prev.end) prev.end = Math.max(prev.end, m.end);
                    else merged.push(m);
                }
            });
            
            // Build string
            let result = "";
            
            // We want to create a snippet around the FIRST match so it's not huge
            let firstMatch = merged[0];
            let startContext = Math.max(0, firstMatch.start - 60);
            let endContext = Math.min(sourceText.length, firstMatch.start + 140);
            
            let isStartTruncated = startContext > 0;
            let isEndTruncated = endContext < sourceText.length;
            
            let pointer = startContext;
            
            // Filter matches that fall into our snippet window
            let activeMatches = merged.filter(m => m.end > startContext && m.start < endContext);
            
            activeMatches.forEach(m => {
                let mStart = Math.max(pointer, m.start);
                let mEnd = Math.min(endContext, m.end);
                
                result += sourceText.substring(pointer, mStart);
                result += `<span class="hl-word">${sourceText.substring(mStart, mEnd)}</span>`;
                pointer = mEnd;
            });
            
            result += sourceText.substring(pointer, endContext);
            
            return (isStartTruncated ? "..." : "") + result + (isEndTruncated ? "..." : "");
        }

        function doSearch() {
            const inputs = document.querySelectorAll('.adv-search-input');
            inputs.forEach(i => saveHistoryTerm(i.value.trim()));
            closeAllDropdowns();
            
            const terms = Array.from(inputs).map(i => removeAccents(i.value.trim())).filter(v => v.length > 0);
            const resultsDiv = document.getElementById('results');

            if (terms.length === 0) {
                resultsDiv.innerHTML = '<p style="text-align:center; color:#94a3b8; font-style: italic;">Παρακαλώ εισάγετε τουλάχιστον μία λέξη...</p>';
                return;
            }
            
            const matchType = document.querySelector('input[name="matchType"]:checked').value; // 'AND' or 'OR'
            
            const matches = qData.filter(q => {
                let shortAnswer = "";
                if (q.content && q.content.includes("<!-- SPLIT -->")) {
                    shortAnswer = q.content.split("<!-- SPLIT -->")[0];
                } else if (q.content) {
                    shortAnswer = q.content;
                } else {
                    shortAnswer = q.correctAnswer || q.answer || "";
                }
                
                // EXPANDED SCOPE: Chapter, Subchapter, Question, Short Answer
                const fullText = [
                    q.chapter || "",
                    q.subchapter || "",
                    q.question || "",
                    shortAnswer
                ].join(" ");
                
                // Strip HTML for searching
                const cleanText = fullText.replace(/<[^>]*>?/gm, ' ');
                const ans = removeAccents(cleanText);
                
                // Attach clean text temporarily for the snippet generation
                q._cleanText = cleanText; 
                
                if (matchType === "AND") {
                    return terms.every(t => ans.includes(t));
                } else {
                    return terms.some(t => ans.includes(t));
                }
            });
            
            if (matches.length === 0) {
                resultsDiv.innerHTML = '<p style="text-align:center; color:#ef4444; font-weight:bold;">Δεν βρέθηκαν αποτελέσματα.</p>';
                return;
            }
            
            resultsDiv.innerHTML = `<p style="font-weight:bold; color:#f97316; margin-bottom: 15px;">
                Βρέθηκαν ${matches.length} ερωτήσεις (Ταίριασμα: ${matchType === 'AND' ? 'Όλες οι λέξεις' : 'Έστω μία λέξη'}):
            </p>`;
            
            matches.forEach(res => {
                const idx = qData.indexOf(res);
                const div = document.createElement('div');
                div.className = 'result-item';
                
                let title = res.chapter || "Ερώτηση";
                if (res.subchapter) title += " - " + res.subchapter;
                
                const snippet = highlightMatch(res._cleanText, terms);
                
                div.innerHTML = `
                    <div class="result-title">${title}</div>
                    <div class="result-snippet">${snippet}</div>
                `;
                
                div.onclick = () => {
                    localStorage.setItem('search_target_terms', JSON.stringify(terms));
                    localStorage.setItem('search_target_index', idx.toString());
                    
                    if (window.opener && !window.opener.closed) {
                        try { window.opener.focus(); } catch(e) {}
                    } else {
                        alert("Παρακαλώ πηγαίνετε στο κεντρικό παράθυρο για να δείτε την ερώτηση. Αν το έχετε κλείσει, ανοίξτε το ξανά.");
                    }
                };
                
                resultsDiv.appendChild(div);
            });
        }
    </script>
</body>
</html>
